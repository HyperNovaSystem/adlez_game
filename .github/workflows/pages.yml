# Deploy Adlez to GitHub Pages.
# Site: https://hypernovasystem.github.io/adlez_game/
#
# vite.config.ts aliases @nova/core to ../hypernova/src/core, so the job
# rebuilds the local sibling layout: this repo in ./app, the engine in
# ./hypernova. The engine core has no dependencies, so it needs no install.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress stays false per the official Pages pattern: in-flight
# production deployments complete; queued runs are still skipped.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # hypernova has no release tags; pin the engine commit. Bump deliberately.
  HYPERNOVA_REF: 03014ed2bd7bff8e6f0a2bbe4548b2ad5e1614f5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          path: app

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          repository: HyperNovaSystem/hypernova
          ref: ${{ env.HYPERNOVA_REF }}
          path: hypernova

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22

      - name: Install app
        working-directory: app
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0

      # Relative base keeps asset URLs working under the /<repo>/ subpath.
      - name: Build
        working-directory: app
        run: npm run build -- --base ./

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
